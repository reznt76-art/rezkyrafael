kp<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezky Rafael Wachyudi | Portofolio TKJ Cyberpunk</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(12, 19, 36, 0.7);
            --primary-neon: #00f0ff;
            --secondary-neon: #ff0055;
            --accent-neon: #39ff14;
            --purple-neon: #b026ff;
            --text-color: #e0f7fc;
            --text-dim: #8baac9;
            --border-glow: rgba(0, 240, 255, 0.4);
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            overflow-x: hidden;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Background Particle Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Scanline Overlay */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.6;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 8, 17, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glow);
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .logo {
            font-family: var(--font-head);
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
            letter-spacing: 2px;
        }

        .logo span { color: var(--secondary-neon); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-family: var(--font-head);
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-neon);
            text-shadow: 0 0 8px var(--primary-neon);
        }

        /* Header / Hero Section */
        header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 8% 60px;
            gap: 50px;
            flex-wrap: wrap;
        }

        .profile-container {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon), var(--purple-neon));
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5), inset 0 0 15px rgba(255, 0, 85, 0.5);
            animation: rotateGlow 6s linear infinite;
        }

        @keyframes rotateGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .profile-img-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #000;
        }

        .profile-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .edit-photo-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--secondary-neon);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 0 15px var(--secondary-neon);
            transition: 0.3s;
            z-index: 10;
        }

        .edit-photo-btn:hover {
            transform: scale(1.15);
            background: var(--primary-neon);
            box-shadow: 0 0 20px var(--primary-neon);
        }

        #photoInput { display: none; }

        .hero-text {
            max-width: 650px;
        }

        .hero-text .badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 5px 15px;
            border-radius: 20px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .hero-text h1 {
            font-family: var(--font-head);
            font-size: 2.8rem;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .edit-name-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .edit-name-btn:hover { color: var(--primary-neon); }

        .typing-text {
            font-family: var(--font-code);
            color: var(--accent-neon);
            font-size: 1.3rem;
            margin-bottom: 20px;
            min-height: 32px;
        }

        .hero-desc {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .social-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--primary-neon);
            font-size: 1.3rem;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .social-btn:hover {
            transform: translateY(-5px);
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 20px var(--primary-neon);
        }

        /* Section Layout */
        section {
            padding: 80px 8%;
        }

        .section-title {
            font-family: var(--font-head);
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 50px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--secondary-neon);
            margin: 10px auto 0;
            box-shadow: 0 0 10px var(--secondary-neon);
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .skill-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            padding: 25px;
            border-radius: 12px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary-neon);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }

        .skill-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .skill-header i {
            font-size: 2rem;
            color: var(--primary-neon);
        }

        .skill-header h3 {
            font-family: var(--font-head);
            font-size: 1.2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-neon), var(--purple-neon));
            box-shadow: 0 0 10px var(--primary-neon);
            width: 0%;
            transition: width 1.5s ease-in-out;
        }

        /* Project Cards */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .project-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
        }

        .project-img {
            width: 100%;
            height: 180px;
            background: #0a1128;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--primary-neon);
            border-bottom: 1px solid var(--border-glow);
        }

        .project-info {
            padding: 20px;
        }

        .project-info h3 {
            font-family: var(--font-head);
            color: #fff;
            margin-bottom: 10px;
        }

        .project-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .tag {
            font-family: var(--font-code);
            font-size: 0.75rem;
            background: rgba(57, 255, 20, 0.1);
            color: var(--accent-neon);
            border: 1px solid var(--accent-neon);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Tool Section (Subnet Calculator) */
        .tool-box {
            background: var(--card-bg);
            border: 1px solid var(--primary-neon);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: var(--font-head);
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--primary-neon);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            color: #fff;
            font-family: var(--font-code);
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px var(--primary-neon);
        }

        .btn-neon {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--primary-neon);
            color: var(--primary-neon);
            font-family: var(--font-head);
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-neon:hover {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 20px var(--primary-neon);
        }

        .calc-result {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            display: none;
        }

        /* Contact Section */
        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .contact-info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        .contact-info-card:hover {
            border-color: var(--primary-neon);
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .contact-info-card i {
            font-size: 2rem;
            color: var(--primary-neon);
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-glow);
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--text-dim);
            background: rgba(5, 8, 17, 0.95);
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .name-wrapper {
                justify-content: center;
            }

            .hero-text h1 {
                font-size: 2rem;
            }

            .social-bar {
                justify-content: center;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>

    <canvas id="bg-canvas"></canvas>

    <!-- Navigation -->
    <nav>

        <ul class="nav-links">
            <li><a href="#about">// PROFIL</a></li>

            <li><a href="#tools">// IP CALC</a></li>
            <li><a href="#contact">// KONTAK</a></li>
        </ul>
    </nav>

    <header id="about">
